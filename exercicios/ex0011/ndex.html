<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em html5</title>
</head>
<body>
    <h1>Imagens Dinâmicas</h1>
    <p>Tente a abrir esse site em vários dispositivos diferentes ou simplismente aumente e diminua o tamanho do seu navegador.</p>
    <picture>
        <source media="(max-width: 750px )" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="imagem reflixivel">
    </picture>
    <h1>reproducao de audio</h1>
    <p>Vamos aprender a reproduzir audios em HTML5.</p>
    <!--<audio src="midia/happy-mistake.mp3" controls autoplay></audio>
    OBS:MP3 WAV OGG-->
    <audio preload="metadata" autoplay controls>
        <source src="midia/floortango.mp3" type="audio/mpeg">
        <source src="midia/floortango.ogg" type="audio/ogg">
        <source src="midia/floortango.wav" type="audio/wav">
        <p>Infelizmente seu navegador não consegue reproduzir áudio. <a href="midia/happy-mistake.mp3">clique aqui para baixar áudio MP3</a></p>
    </audio>

</body>
</html>
