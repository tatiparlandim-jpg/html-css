<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos com HTML5</title>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente </h1>
    <p>Esse vídeo está hospedado no meu próprio servidor.</p>
    <video width="560" poster="imagem/foto-seregeira.png" controls autoplay loop>
        <source src="midea/meu-video.webm" type="video/webm">
        <source src="midea/meu-video.mp4" type="video/mp4">
        <source src="midea/meu-video5.ogv" type="video/ogg">
        <p>Seu navegador não tem compatiblidade com reprodução de vídeos.</p>
    </video>
    <h1>Inserindo videos do youtube</h1>

    <iframe width="560" height="315" 
    src="https://www.youtube.com/embed/leOxpprA5bA" 
    title="YouTube video player" 
    frameborder="0" 
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
    referrerpolicy="strict-origin-when-cross-origin" 
    allowfullscreen>
    </iframe>
    
</html>
