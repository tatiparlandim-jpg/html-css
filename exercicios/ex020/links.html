<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        a {
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited{
            color: chartreuse;
        }

        a:hover {
            color: black;
            text-decoration: underline;
        }
        a:active {
            color: yellow;
        }

        .especial {
            background-color: black;
        }

        a::after {
            content: ' [link]';
            color: rgb(124, 122, 122);
        }

    

       
    </style>
</head>
<body>
    <h1>Personalizando Link</h1>
        <ul>
            <li><a href="https://gustavoguanabara.github.io">Repositório GitHub</a></li>
            <li><a href="http://youtube.com/cursoemvideo/" class="especial">Canal do YouTube</a></li>
            <li><a href="https://www.cursoemvideo.com">Site do CursoemVideo</a></li>
        </ul>
</body>
</html>
