<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio da Imagem</title>
</head>
<body>
    <h1>Imagens flexível</h1>
    <p>Você está vendo a imagem completa? experimente ampliar o tamanho da sua janela para aproveitar melhor a experiência ✨</p>
    <picture>
        <source media="(max-width: 600px )" srcset="paisagem-p.png" type="image/png">
        <source media="(max-width: 1000px )" srcset="paisagem-m.png" type="image/png">
        <img src="paisagem-g.png" alt="imagem flexivel">
    </picture>
   
</body>
</html>
